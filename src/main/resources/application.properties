spring.application.name=SEAL-Hackathon-BE


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.fpt.swp.sealhackathonbe
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.persistAuthorization=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# HIKARICP CONNECTION POOL CONFIG
# Cấu hình tối ưu riêng cho Azure B1 (1 Core, 1.75GB RAM) & Azure SQL Basic (5 DTU)
# ===============================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}

server.port=8080

# Azure App Service chạy sau reverse proxy (TLS termination): phải tin
# X-Forwarded-Proto/Host để Spring sinh đúng redirect_uri dạng https://
# cho luồng OAuth (Google). Không ảnh hưởng khi chạy local.
server.forward-headers-strategy=framework

# Host public theo từng môi trường dùng cho link được tạo và CORS.
app.frontend-url=${FRONTEND_URL}
app.backend-url=${BACKEND_URL}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

app.notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:false}

logging.level.org.hibernate=DEBUG
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

jwt.secret=${JWT_SECRET_KEY}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

